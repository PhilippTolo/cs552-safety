model_name: "/scratch/safety/sft_vibe4_v2base/merged"

# Filtered "suitable" examples from vibe-trainers MCQ (1-5/8 correct at temp=1.0)
# Generated by grpo_filter_safety_v2.py
grpo_dataset: "/scratch/safety/data/grpo_vibe_filtered.jsonl"

# Must match the system prompt baked into the SFT model's chat_template.
# sft_vibe4_v2base was trained with this system prompt.
system_prompt: >-
  You are a safety expert. For each question, select the single correct answer.
  Respond only with a boxed letter, e.g. \boxed{A}. /no_think

lora_config:
  # Lower rank than SFT (sft_vibe4_v2base used r=16) — GRPO refines, not learns.
  # Matches math teammate's pattern: SFT r=256, GRPO r=64.
  r: 64
  lora_alpha: 64                # alpha/r = 1 (same ratio convention as math teammate)
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj",
                   "gate_proj", "up_proj", "down_proj"]
  lora_dropout: 0
  bias: "none"

grpo_args:
  # ── Core ──────────────────────────────────────────────────────────────────────
  report_to: "none"
  output_dir: "/scratch/safety/grpo_safety_v2"
  remove_unused_columns: false   # MUST be false — "answer" column reaches reward fns

  # ── Batch & Generation ─────────────────────────────────────────────────────────
  per_device_train_batch_size: 2     # 2 × 8 accum = 16 completions / step = 2 prompts
  gradient_accumulation_steps: 8
  num_generations: 8                 # G in GRPO paper
  # Safety MCQ answers are ~5 tokens (\boxed{X}). 64 gives plenty of room.
  # DO NOT increase to 2048 — that causes zero-reward truncation for short answers.
  max_completion_length: 64

  # ── vLLM rollout (colocate = share training GPU, no separate server) ────────────
  use_vllm: true
  vllm_mode: "colocate"
  vllm_gpu_memory_utilization: 0.45  # fraction for vLLM KV-cache; leaves 55% for training

  # ── Rollout sampling — maximum diversity (same as math teammate) ────────────────
  # GRPO needs diverse completions within each group; peaked sampling collapses
  # advantage variance to zero → no gradient. Full vocab = maximum diversity.
  temperature: 1.0
  top_p: 1.0
  top_k: -1    # -1 = all tokens (vLLM SamplingParams "disabled"; null crashes)
  min_p: 0

  # ── Optimisation ────────────────────────────────────────────────────────────────
  # "LoRA Without Regret" / "Learning Rate Matters" (arxiv 2602.04998):
  # LoRA LR should be ~10× FullFT LR. FullFT GRPO ≈ 3e-6 to 5e-6 → LoRA GRPO ≈ 3e-5 to 5e-5.
  # Original v2 run used 1.0e-5 (likely too low — in FullFT territory, not LoRA territory).
  # If v2 shows frac_reward_zero_std ≥ 0.8, kill and restart with this value instead.
  learning_rate: 3.0e-5              # LoRA-adjusted GRPO LR (v2 was 1e-5 — too low per paper)
  lr_scheduler_type: "cosine"
  warmup_steps: 50
  num_train_epochs: 1                # >1 epoch risks reward hacking

  # ── Dr.GRPO + DAPO algorithm ────────────────────────────────────────────────────
  # beta=0.0: no KL penalty (DAPO / Open-Reasoner-Zero / Understanding R1-Zero recommendation).
  # Removes the need for a frozen reference model → simpler and more explorative.
  beta: 0.0
  epsilon: 0.2         # PPO lower clip (standard)
  epsilon_high: 0.28   # DAPO "clip-higher": asymmetric upper clip prevents entropy collapse
  scale_rewards: false # Dr.GRPO: remove per-group std normalisation (biased estimator)
  loss_type: "dr_grpo" # Dr.GRPO: also removes sequence-length normalisation

  # Truncated completions never reached \boxed{} — their reward is misleading.
  mask_truncated_completions: true

  # Log sample completions for qualitative monitoring (W&B or stdout).
  log_completions: true

  # ── Reward weights ──────────────────────────────────────────────────────────────
  # Matches order in grpo_safety_v2.py: [correctness_reward, format_reward]
  # correctness dominates; format is a 0.5× nudge (same ratio as math teammate)
  reward_weights: [1.0, 0.5]

  # ── Hardware ────────────────────────────────────────────────────────────────────
  bf16: true
  gradient_checkpointing: true
  # Using eager attention (not FA2) — safety-specific: Qwen3 BF16 NaN risk with FA2.
  # Math teammate uses FA2 successfully but started fresh; we build on merged LoRA.

  # ── Logging ─────────────────────────────────────────────────────────────────────
  logging_steps: 10

  # ── Saving ──────────────────────────────────────────────────────────────────────
  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 10

  # ── Evaluation ──────────────────────────────────────────────────────────────────
  eval_strategy: "steps"
  eval_steps: 200
  per_device_eval_batch_size: 8     # must be divisible by num_generations (8)
